name: Refresh FF Tracker Data

# Triggers a Coolify redeploy on a schedule. The Steam data fetch itself
# happens inside the Docker build — this workflow's only job is to ask
# Coolify to rebuild+redeploy so that build step runs again and picks up
# fresh stats.
#
# COOLIFY_WEBHOOK_URL: the app resource's Configuration -> Webhooks ->
#   "Deploy Webhook (auth required)" URL (already has ?uuid=... baked in).
# COOLIFY_API_TOKEN: a token from Keys & Tokens -> API Tokens with the
#   `deploy` permission scope. Both stored as repo secrets.
# See: https://coolify.io/docs/api-reference/authorization

on:
  schedule:
    - cron: "0 13 * * *" # daily @ 13:00 UTC — adjust to taste
  workflow_dispatch:

jobs:
  trigger-deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Call Coolify deploy webhook
        run: |
          curl -sf -X GET "${{ secrets.COOLIFY_WEBHOOK_URL }}" \
            -H "Authorization: Bearer ${{ secrets.COOLIFY_API_TOKEN }}"
